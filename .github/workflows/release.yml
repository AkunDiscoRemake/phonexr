# Собирает Compatibility-Layer SDK на стороне GitHub и кладёт JAR в релиз.
name: Сборка и релиз

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релиза, например v1.0.0"
        required: true
        default: "v1.0.0"

jobs:
  sdk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Сборка SDK
        run: ./gradlew :sdk:build --no-daemon
      - name: Имя файла по версии
        id: name
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          SDK="Compatibility-Layer-SDK-${TAG#v}.zip"
          mkdir -p release-sdk/Compatibility-Layer-SDK
          cp sdk/build/libs/sdk.jar release-sdk/Compatibility-Layer-SDK/Compatibility-Layer-SDK.jar
          cp -R sdk/docs sdk/runtime sdk/tools release-sdk/Compatibility-Layer-SDK/
          cd release-sdk && zip -qr "../$SDK" Compatibility-Layer-SDK && cd ..
          echo "sdk=$SDK" >> "$GITHUB_OUTPUT"
      - name: В релиз
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ github.event.inputs.tag || github.ref_name }}" >/dev/null 2>&1 \
            || gh release create "${{ github.event.inputs.tag || github.ref_name }}" --title "Compatibility-Layer ${{ github.event.inputs.tag || github.ref_name }}" --generate-notes
          gh release upload "${{ github.event.inputs.tag || github.ref_name }}" "${{ steps.name.outputs.sdk }}" --clobber
